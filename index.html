<!-- JAVASCRIPT -->

<script>

    const payment = document.querySelectorAll(
        'input[name="payment"]'
    );

    const cashRadio = document.getElementById("cash");
    const mobileRadio = document.getElementById("mobile");
    const cashDetails = document.getElementById("cashDetails");
    const mobile = document.getElementById("mobilePayment");
    const patientForm = document.getElementById("patientForm");


    // RADIO BUTTON TOGGLE

    payment.forEach(function(option) {

        option.addEventListener("click", function(event) {

            const wasSelected = this.dataset.selected === "true";

            if (wasSelected) {

                event.preventDefault();

                const selectedRadio = this;

                setTimeout(function() {
                    selectedRadio.checked = false;
                    selectedRadio.dataset.selected = "false";
                    updatePayment();
                }, 0);

                return;

            } else {

                payment.forEach(function(radio) {
                    radio.dataset.selected = "false";
                });

                this.dataset.selected = "true";

                updatePayment();

            }

        });

    });


    // UPDATE PAYMENT DISPLAY

    function updatePayment() {

        cashDetails.style.display =
            cashRadio.checked ? "block" : "none";

        mobile.disabled = !mobileRadio.checked;
        mobile.required = mobileRadio.checked;

        mobile.style.display =
           mobileRadio.checked ? "inline-block" : "none";

        if (!cashRadio.checked) {
            document.querySelector('[name="amount"]').value = "";
            document.querySelector('[name="receiver"]').value = "";
            document.querySelector('[name="date"]').value = "";
        }

        if (!mobileRadio.checked) {
            mobile.value = "";
        }

    }

<p>TRICIA</p>
    // FORM SUBMISSION

    patientForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const selectedPayment = document.querySelector(
            'input[name="payment"]:checked'
        );

        if (!selectedPayment) {

            alert("Please select a payment method.");
            return;

        }

        if (!this.checkValidity()) {

            this.reportValidity();
            return;

        }

        if (selectedPayment.value === "Mobile Payment" && !mobile.value) {

            alert("Please select a mobile payment network.");
            return;

        }

        document.getElementById("message").innerHTML =
            "Patient registration submitted successfully!";

    });


    // CLEAR FORM

    patientForm.addEventListener("reset", function() {

        cashDetails.style.display = "none";

        payment.forEach(function(radio) {
            radio.dataset.selected = "false";
        });
        mobile.disabled = true;
        mobile.required = false;
        mobile.value = "";
        document.getElementById("message").innerHTML = "";
    });
</script>
